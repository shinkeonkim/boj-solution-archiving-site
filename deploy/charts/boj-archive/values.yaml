fullnameOverride: boj-archive

image:
  repository: ghcr.io/shinkeonkim/boj-archive
  tag: latest
  pullPolicy: Always

containerPort: 8899

# main.py reads ADMIN_PASSWORD / SECRET_KEY from the environment (falls back to
# insecure defaults otherwise) — this chart never sets real values, it only
# wires a Secret name. The homelab GitOps repo supplies the actual Secret via
# SOPS, same pattern as aws-study-site's jwtSecretName.
secretName: boj-archive-secrets

# SQLite is single-writer — this must stay at 1 replica with Recreate strategy,
# same constraint url-shortener's chart documents for its own SQLite file.
replicaCount: 1

persistence:
  # 이 클러스터는 노드 3대뿐이라 기본 longhorn(replica 2)이 여유 공간 부족으로
  # "insufficient storage"를 내며 스케줄링에 실패했다(실제로 겪음, 2026-08-28) —
  # SQLite 단일 파일이라 어차피 복제 여러 개가 필요 없어서 longhorn-r1(replica 1)로.
  storageClass: longhorn-r1
  dbSize: 1Gi
  dataSize: 5Gi

domain: boj.xn--hy1by51c.kr

ingress:
  # 실제 클러스터의 ClusterIssuer 이름은 letsencrypt-prod가 아니라 cloudflare-dns01이다
  # (kubectl get clusterissuer로 확인, 2026-08-28) — 잘못된 이름으로 62분째 인증서
  # 발급이 멈춰 있었다.
  clusterIssuer: cloudflare-dns01
